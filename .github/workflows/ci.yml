name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Kakoune
        run: sudo apt-get update && sudo apt-get install --yes kakoune lua5.1
      - name: Parse and load the module, check the Lua
        run: ./tests/check.sh
